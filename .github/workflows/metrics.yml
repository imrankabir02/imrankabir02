name: Metrics

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: imrankabir02
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Dhaka
